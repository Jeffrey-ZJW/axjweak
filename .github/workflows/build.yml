name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          brew install ldid dpkg
      
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          ls -la $THEOS/makefiles/common.mk
      
      - name: Setup iOS SDK from Xcode
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_NAME=$(basename $SDK_PATH)
          mkdir -p $THEOS/sdks
          cp -R $SDK_PATH $THEOS/sdks/$SDK_NAME
          ls -la $THEOS/sdks/
      
      - name: Build
        run: |
          echo "当前目录: $(pwd)"
          echo "THEOS=$THEOS"
          ls -la $THEOS/makefiles/common.mk || echo "common.mk 不存在!"
          ls -la $THEOS/sdks/ || echo "sdks 目录不存在!"
          echo "--- Makefile 内容 ---"
          cat Makefile
          echo "--- 开始编译 ---"
          export PATH=$THEOS/bin:$PATH
          make THEOS=$THEOS package FINALPACKAGE=1
      
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: fishtweak-deb
          path: packages/*.deb
