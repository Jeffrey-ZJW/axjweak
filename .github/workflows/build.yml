name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          brew install ldid dpkg
      
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          ls -la $THEOS/makefiles/common.mk
      
      - name: Download iOS SDK from theos/sdks
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          echo "--- 可用 SDK 列表 ---"
          ls /tmp/theos-sdks/
          LATEST_SDK=$(ls -d /tmp/theos-sdks/iPhoneOS*.sdk | sort -V | tail -1)
          echo "--- 选择 SDK: $LATEST_SDK ---"
          cp -R "$LATEST_SDK" $THEOS/sdks/
          echo "--- 最终 SDK 目录 ---"
          ls -la $THEOS/sdks/
      
      - name: Build
        run: |
          export PATH=$THEOS/bin:$PATH
          make THEOS=$THEOS package FINALPACKAGE=1
      
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: fishtweak-deb
          path: packages/*.deb
