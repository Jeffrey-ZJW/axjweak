name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          brew install ldid dpkg
      
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          ls -la $THEOS/makefiles/common.mk
      
      - name: Setup iOS SDK from Xcode
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_NAME=$(basename $SDK_PATH)
          REAL_PATH=$(readlink -f "$SDK_PATH" || realpath "$SDK_PATH")
          mkdir -p $THEOS/sdks
          cp -RL "$REAL_PATH" "$THEOS/sdks/$SDK_NAME"
          
          # 关键：删掉冲突的 libxml 目录
          rm -rf $THEOS/sdks/$SDK_NAME/usr/include/libxml
          
          echo "--- SDK 内容检查 ---"
          ls -la $THEOS/sdks/$SDK_NAME/usr/include/ | grep -i xml
      
      - name: Build
        run: |
          export PATH=$THEOS/bin:$PATH
          make THEOS=$THEOS package FINALPACKAGE=1
      
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: fishtweak-deb
          path: packages/*.deb
