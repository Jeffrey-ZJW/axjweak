name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    env:
      THEOS: /Users/runner/theos
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          brew install ldid dpkg
      
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "--- 验证 Theos ---"
          ls -la $THEOS/makefiles/common.mk
      
      - name: Setup iOS SDK from Xcode
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_NAME=$(basename $SDK_PATH)
          echo "找到 SDK: $SDK_PATH"
          mkdir -p $THEOS/sdks
          cp -R $SDK_PATH $THEOS/sdks/$SDK_NAME
          echo "--- SDK 目录内容 ---"
          ls -la $THEOS/sdks/
      
      - name: Verify
        run: |
          echo "THEOS=$THEOS"
          ls -la $THEOS/makefiles/common.mk || echo "MISSING common.mk"
          ls -la $THEOS/sdks/ || echo "MISSING sdks"
      
      - name: Build
        run: |
          export PATH=$THEOS/bin:$PATH
          make package FINALPACKAGE=1
      
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: fishtweak-deb
          path: packages/*.deb
