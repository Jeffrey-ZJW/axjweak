name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
      
      - name: Install Dependencies
        run: |
          brew install ldid dpkg
      
      - name: Install SDKs
        run: |
          $THEOS/bin/install-theos-sdks || true
      
      - name: Verify Theos
        run: |
          echo "THEOS=$THEOS"
          ls -la $THEOS/makefiles/ || echo "makefiles not found"
          ls -la $THEOS/sdks/ || echo "sdks not found"
      
      - name: Build
        run: |
          make package FINALPACKAGE=1
        env:
          THEOS: ${{ env.THEOS }}
      
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: fishtweak-deb
          path: packages/*.deb
