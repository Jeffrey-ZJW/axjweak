name: Build Tweak

on:
  push:
    branches: [ main, fakeip-366 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          brew install ldid dpkg
      
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          ls -la $THEOS/makefiles/common.mk
      
      - name: Download iOS SDK from theos/sdks
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          echo "--- 可用 SDK 列表 ---"
          ls /tmp/theos-sdks/
          LATEST_SDK=$(ls -d /tmp/theos-sdks/iPhoneOS*.sdk | sort -V | tail -1)
          echo "--- 选择 SDK: $LATEST_SDK ---"
          cp -R "$LATEST_SDK" $THEOS/sdks/
          echo "--- 最终 SDK 目录 ---"
          ls -la $THEOS/sdks/
      
      - name: Build
        run: |
          export PATH=$THEOS/bin:$PATH
          make THEOS=$THEOS package FINALPACKAGE=1
      
      - name: Upload .deb (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fishtweak-deb
          path: packages/*.deb
      
      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "版本号: $VERSION"
      
      - name: 发布 Release（main 上传 fishtweak.deb 形成 latest 直链；fakeip-366 只加测试资产，不覆盖 latest 资产）
        run: |
          ls -la packages/
          gh release create v$VERSION --title "v$VERSION" --notes "自动构建发布 v$VERSION" || echo "release 已存在，继续上传覆盖资产"
          cp packages/*.deb fishtweak.deb
          if [ "${GITHUB_REF_NAME}" = "fakeip-366" ]; then
            # 测试分支：只上传独立命名的资产，绝不覆盖 latest/download/fishtweak.deb
            cp fishtweak.deb fishtweak-$VERSION-fakeip.deb
            gh release upload v$VERSION fishtweak-$VERSION-fakeip.deb --clobber
            echo "测试资产已上传: fishtweak-$VERSION-fakeip.deb（latest 直链仍指向原 fishtweak.deb）"
          else
            # 统一改名为固定资产名：daemon 内 kUpdateURL 固定引用 /releases/latest/download/fishtweak.deb
            gh release upload v$VERSION fishtweak.deb --clobber
            echo "发布完成: https://github.com/Jeffrey-ZJW/axjweak/releases/latest/download/fishtweak.deb"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
